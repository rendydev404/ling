name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 2 days at 03:00 UTC (Supabase pauses Free Tier after 7 days of inactivity)
    - cron: "0 3 */2 * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Send heartbeat to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://aachoudpemjvgjqlvcqp.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          KEEPALIVE_SOURCE: "github-actions"
        run: node scripts/supabase-keepalive.mjs
